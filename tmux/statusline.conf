setw -g window-status-current-format '#[fg=#18202a,bg=#eee8d5]#[fg=#b58900,bg=#eee8d5] #I #[fg=#eee8d5,bg=#b58900] #W #[fg=#b58900,bg=#18202a,nobold]'


